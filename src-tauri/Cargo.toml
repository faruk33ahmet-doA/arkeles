[package]
name = "arkeles"
version = "0.0.0"
description = "ARKELÉS — kişisel işletim sistemi"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
# Tauri 2 mobil hedefleri için kütüphane adı ayrı tutulur.
name = "arkeles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
# Belgeyi sahibi olan uygulamaya devretmek için (Sprint 3 madde 8).
# ARKELÉS belge RENDER ETMEZ — madde 7.3.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Frontmatter (YAML) ayrıştırma. Anayasa madde 14.1: tek amaçlı, dar bağımlılık.
serde_yaml = "0.9"

# Dosya izleyici — madde 20.4 (200 ms debounce üstte kurulur).
notify = "7"

# İçerik hash'i — madde 15.6: hash aynıysa yeniden indeksleme yapılmaz.
# Tauri ağacında zaten derleniyor, ek maliyet yok.
sha2 = "0.10"

# Rust → TypeScript tip üretimi. Madde 14.2: elle yazılmış IPC tipi YASAK.
ts-rs = "10"

# Hermes WebSocket JSON-RPC istemcisi (Sprint 4).
#
# Hermes'in gerçek sözleşmesi `ws://127.0.0.1:9119/api/ws` üzerinde JSON-RPC
# 2.0'dır — el yazımı HTTP ile konuşulamaz. `tungstenite` senkron, tokio
# gerektirmez ve TLS özellikleri KAPALI: yalnız loopback'e bağlanıyoruz
# (madde 19.1), TLS yığını gereksiz ağırlık olurdu (madde 14.1).
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

# Anayasa madde 15: SQLite index. `bundled` → sistem SQLite'ına bağımlı
# olmayız, sürüm sürprizi yaşamayız (madde 13: tamamen lokal, öngörülebilir).
rusqlite = { version = "0.32", features = ["bundled"] }

# Hata tipleri. Anayasa madde 14.1 gereği minimum bağımlılık:
# anyhow yerine thiserror — kütüphane katmanında tipli hata doğru olan.
thiserror = "2"

[profile.release]
# Anayasa madde 34.1: boşta RAM < 180 MB, ikili küçük olmalı.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
